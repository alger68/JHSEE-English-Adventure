name: Validate and publish English Adventure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate learning rules
        run: node --test tests/core.test.cjs
      - name: Build complete content
        run: node scripts/build.mjs
      - name: Check Pages setup
        id: pages-status
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.get(context.repo);
            core.setOutput('enabled', data.has_pages ? 'true' : 'false');
            if (!data.has_pages) {
              await core.summary.addHeading('V2 is validated; Pages needs its initial setup')
                .addRaw('Open repository Settings → Pages and select GitHub Actions as the source, then run this workflow again. Future pushes deploy automatically.').write();
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
